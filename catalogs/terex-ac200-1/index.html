<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEREX AC200-1 Electronic PartBook</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="../catalog-ui.css?v=mobile-layout-1"></head>
<body class="catalog-ui">
<header>
  <div class="brand"><b>TEREX</b><span>Electronic PartBook</span><small>AC200-1</small></div>
  <div class="toolbar">
    <input id="search" placeholder="Search part number, description, position..." autocomplete="off">
    <button id="themeBtn">☾</button>
  </div>
</header>
<main>
  <aside id="sidebar" class="catalog-sidebar">
    <div class="sidehead"><b>Catalog</b><span id="catalogCount"></span></div>
    <input id="catalogFilter" class="miniSearch" placeholder="Filter catalog...">
    <div id="catalogs"></div>
  </aside>
  <section class="workspace">
    <div class="crumb" id="crumb">Select a catalog</div>
    <div class="viewer">
      <div class="viewerTools">
        <button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">+</button>
        <button id="fitBtn">Fit</button>
      </div>
      <div id="canvasWrap"><div id="canvas"><img id="diagram"><div id="hotspots"></div></div></div>
    </div>
    <div class="results">
      <div class="resultHead"><b id="resultTitle">Parts</b><span id="resultCount"></span></div>
      <div class="tableWrap">
      <table><thead><tr><th>Pos.</th><th>Part Number</th><th>Description</th><th>Qty</th><th>Catalog</th></tr></thead>
      <tbody id="parts"></tbody></table>
      </div>
    </div>
  </section>
</main>
<div id="modal" class="modal hidden"><div class="modalBox"><button class="close" id="close">×</button><h2 id="mTitle"></h2><div id="mBody"></div></div></div>
<script src="app.js?v=catalog-diagram-fit-2"></script>
<script src="../catalog-ui.js?v=catalog-mobile-zoom-12"></script></body></html>
